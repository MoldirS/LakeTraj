services:
  laketraj:
    build:
      context: .
    platform: linux/amd64
    container_name: laketraj-local

    ports:
      - "127.0.0.1:8765:8765"

    environment:
      HYSPLIT_HOME: /opt/hysplit
      LAKETRAJ_DATA_DIR: /app/data
      LAKETRAJ_RUNTIME_DIR: /var/data/runtime
      LAKETRAJ_RESULTS_DIR: /var/data/results
    
    env_file:
      - .env

    volumes:
      - ./runtime:/var/data/runtime
      - ./presentation_results:/var/data/results
      - ${HYSPLIT_HOST_DIR}:/opt/hysplit:ro:/opt/hysplit:ro

      # HYSPLIT must be installed/provided separately.
      # Uncomment this only if you have a local HYSPLIT installation
      # that you are authorized to use.
      #
      # - /path/to/your/hysplit:/opt/hysplit:ro

    restart: unless-stopped